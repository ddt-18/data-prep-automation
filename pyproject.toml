[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-prep-automation"
version = "0.1.0"
description = "Beginner-friendly, tested automation for cleaning and profiling tabular data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhaara Thakkar" }]
dependencies = [
    # 2.2 is the version the notebook was written against; 3.1 is current.
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "pyarrow>=14",     # Parquet support
    "xlrd>=2.0",       # legacy .xls support
    "ydata-profiling>=4.16,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error::FutureWarning:data_prep.*",
]
